name: Huginn CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin', cache: gradle }
      - run: ./gradlew lint
        env:
          HUGINN_QR_HMAC_KEY: ${{ secrets.HUGINN_QR_HMAC_KEY }}
          HUGINN_TOKEN_HMAC_KEY: ${{ secrets.HUGINN_TOKEN_HMAC_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: lint-results, path: app/build/reports/lint-results*.html }

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin', cache: gradle }
      - run: ./gradlew testDebugUnitTest
        env:
          HUGINN_QR_HMAC_KEY: ${{ secrets.HUGINN_QR_HMAC_KEY }}
          HUGINN_TOKEN_HMAC_KEY: ${{ secrets.HUGINN_TOKEN_HMAC_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: unit-test-results, path: app/build/reports/tests/ }
      - uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Test Results
          path: app/build/test-results/**/*.xml
          reporter: java-junit

  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: [ lint, unit-tests ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin', cache: gradle }
      - run: ./gradlew assembleDebug
        env:
          HUGINN_QR_HMAC_KEY: ${{ secrets.HUGINN_QR_HMAC_KEY }}
          HUGINN_TOKEN_HMAC_KEY: ${{ secrets.HUGINN_TOKEN_HMAC_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: huginn-debug.apk, path: app/build/outputs/apk/debug/*.apk, retention-days: 7 }

  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: [ lint, unit-tests ]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin', cache: gradle }
      - run: ./gradlew assembleRelease
        env:
          HUGINN_QR_HMAC_KEY: ${{ secrets.HUGINN_QR_HMAC_KEY }}
          HUGINN_TOKEN_HMAC_KEY: ${{ secrets.HUGINN_TOKEN_HMAC_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: huginn-release.apk, path: app/build/outputs/apk/release/*.apk, retention-days: 30 }

  security-scan:
    name: Security — No Hardcoded Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for hardcoded keys
        run: |
          if grep -r "SRBR_HUGINN_ODIN_SECRET\|SRBR_HEIMDALL_TOKEN_SECRET" --include="*.kt" app/src/main; then
            echo "FAIL: Hardcoded secret found in source!" && exit 1
          fi
          echo "PASS: No hardcoded secrets found"
